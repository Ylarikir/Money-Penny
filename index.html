<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Penny</title>
<meta name="theme-color" content="#0F1C24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Penny">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="supabase-adapter.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1C24;--surface:#132430;--surface2:#18303F;--ink:#FFFFFF;--text:#EEF2F0;--muted:#7F9AA6;--soft:#C9D3D8;--line:#22384A;
  --accent:#9BF9C2;--accent-ink:#0F1C24;--accent-soft:rgba(155,249,194,.12);--teal:#1AA6B7;--late:#1AA6B7;
  --warn:#F5C979;--warn-soft:rgba(245,201,121,.12);--danger:#FF8F85;--danger-soft:rgba(255,143,133,.12);
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --r-sm:8px;--r:12px;--r-lg:16px;--logo-filter:none;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{
  --bg:#EEF2F0;--surface:#FFFFFF;--surface2:#F4F7F6;--ink:#0F1C24;--text:#132430;--muted:#4A5C68;--soft:#4A5C68;--line:#C9D3D8;
  --accent:#0F1C24;--accent-ink:#9BF9C2;--accent-soft:rgba(26,166,183,.12);--teal:#137F8C;--late:#1AA6B7;
  --warn:#8A5A00;--warn-soft:#FBF0DA;--danger:#B23A31;--danger-soft:#FBE7E5;--shadow:0 12px 40px rgba(15,28,36,.18);--logo-filter:invert(1);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.mint{color:var(--accent)}
:root[data-theme="light"] .mint{color:var(--teal)}

/* Header */
header.top{background:var(--bg)}
.brandbar{display:flex;align-items:center;gap:14px;padding-top:24px}
.brandbar img{height:22px;width:auto;filter:var(--logo-filter)}
.brandbar .div{width:1px;height:20px;background:var(--line)}
.brandbar .lbl{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
:root[data-theme="light"] .brandbar .lbl{color:var(--teal)}
.top-row{display:flex;align-items:flex-start;gap:12px;padding-top:26px;flex-wrap:wrap}
.round-name{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.1;margin:0;text-transform:uppercase;color:var(--ink)}
.round-sub{color:var(--soft);font-size:14px;margin-top:6px;font-style:italic;font-weight:500}
.sp{flex:1}
.meter-block{padding:22px 0 20px;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:stretch}
.meter-card{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px}
.meter-card .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.meter-big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.meter-of{font-size:13px;font-weight:500}
.meter-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.meter{position:relative;height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.meter .seg{position:absolute;top:0;bottom:0;left:0;border-radius:6px 0 0 6px}
.meter .c{background:var(--accent)}
:root[data-theme="light"] .meter .c{background:var(--teal)}
.meter .l{background:repeating-linear-gradient(135deg,var(--late) 0 6px,transparent 6px 10px);border-radius:0}
.meter .tgt{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .k-c{background:var(--accent)}
:root[data-theme="light"] .legend .k-c{background:var(--teal)}
.legend .k-l{background:repeating-linear-gradient(135deg,var(--late) 0 3px,transparent 3px 5px);border:1px solid var(--late)}
.legend .k-t{background:var(--ink);width:2px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--teal);background:transparent;padding:6px 16px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--accent-soft)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .n{font-weight:500;opacity:.7;margin-left:6px}

main.wrap{padding-top:28px;padding-bottom:60px}
header.top .wrap{padding-bottom:4px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
:root[data-theme="light"] .btn.ghost{color:var(--teal)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--danger);color:var(--bg)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.ro .w{display:none!important}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px}
.panel h2,.section h2{font-size:11.5px;font-weight:700;margin:0;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
:root[data-theme="light"] .panel h2,:root[data-theme="light"] .section h2{color:var(--teal)}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.stat b{display:block;font-size:30px;font-weight:800;color:var(--ink);line-height:1.2}
.stat span{color:var(--soft);font-size:12.5px}
.stat.alert{border-color:var(--danger)}
.stat.alert b{color:var(--danger)}
.empty{color:var(--soft);font-size:13.5px;padding:10px 0}
.empty .btn{margin-top:8px}

ul.clean{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{position:relative;flex:none;margin-top:3px}
.chk input{appearance:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:5px;margin:0;cursor:pointer;display:block;background:transparent}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tmain{flex:1;min-width:0}
.linkish{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:500;color:var(--ink)}
.linkish:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:3px;align-items:center}
.chip{border:1px solid var(--teal);background:transparent;border-radius:999px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip:hover{background:var(--accent-soft)}
.due{font-size:12.5px;color:var(--soft);white-space:nowrap;margin-top:3px}
.due.od{color:var(--danger);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.group-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.group-label.od{color:var(--danger)}

.pstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:thin}
.pcard{flex:0 0 auto;min-width:140px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pcard:hover{border-color:var(--teal)}
.pcard.on{background:var(--accent);border-color:var(--accent)}
.pcard .pn{font-weight:700;color:var(--ink)}
.pcard .pc{font-size:12.5px;color:var(--soft)}
.pcard.on .pn,.pcard.on .pc{color:var(--accent-ink)}
.pcard em{font-style:normal;color:var(--danger);font-weight:600;margin-left:4px}
.pcard.on em{color:var(--accent-ink);text-decoration:underline}
.pchip{border:0;background:none;padding:0;font-size:12.5px;color:var(--soft);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.pchip:hover{color:var(--accent)}
.disc{padding:12px 0;border-top:1px solid var(--line)}
.disc:first-child{border-top:0}
.disc-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.disc-date{font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--ink)}
.kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 8px}
.disc p{margin:6px 0 0;white-space:pre-wrap;color:var(--soft);font-size:13.5px}
.disc,.disc p,.next,.summary,.meta,.tmain,.contact .who{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.xlink{font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;overflow-wrap:anywhere}
.xlink:hover{color:var(--accent)}
.next{margin-top:8px;padding:9px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--bg);border-radius:var(--r-sm);font-size:13px;white-space:pre-wrap;font-style:italic;color:var(--soft)}
.next b{color:var(--accent);font-style:normal}
:root[data-theme="light"] .next b{color:var(--teal)}
.prep{font-size:12.5px;font-weight:600;color:var(--soft)}
.prep.ok{color:var(--accent)}
:root[data-theme="light"] .prep.ok{color:var(--teal)}
.prep.od{color:var(--danger)}
.prep.soon{color:var(--warn)}
.meta .btn.sm{padding:1px 10px;font-size:12px}

.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.stage::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:var(--o,1)}
:root[data-theme="light"] .stage::before{background:var(--teal)}
.stage.passed{color:var(--muted)}
.stage.passed::before{background:var(--muted)}
.prio{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--soft);vertical-align:2px}
.prio.high{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prio.medium{border-color:var(--teal);color:var(--ink)}
.tabgrp{align-self:center;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 4px;white-space:nowrap}
.tabgrp:not(:first-child){margin-left:12px;padding-left:16px;border-left:1px solid var(--line)}
.no-inv .inv-only,.sec-sales .inv-only{display:none!important}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.fq{flex:1 1 170px;min-width:130px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font-size:13px}
.fq::placeholder{color:var(--muted)}
.fsel,.fdate{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font-size:12.5px;max-width:190px}
.fq:focus,.fsel:focus,.fdate:focus{border-color:var(--teal);outline:none}
.fcount{margin:0 0 6px}
.sec-proj .inv-only{display:none!important}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcardp{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--text);font:inherit}
.pcardp:hover{border-color:var(--teal)}
.pc-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.pc-top b{color:var(--ink);font-size:15px;line-height:1.3}
.pbar{height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--accent)}
:root[data-theme="light"] .pbar i{background:var(--teal)}
.pbar.late i{background:var(--danger)}
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg)}
.g-row{display:flex;min-height:38px;border-top:1px solid var(--line)}.g-row:first-child{border-top:0}
.g-label{position:sticky;left:0;z-index:4;flex:none;width:250px;padding:7px 12px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:1px}
.g-label .linkish{font-size:13.5px;text-align:left}.g-label .meta{margin:0;font-size:11.5px}
.g-row.phase .g-label .linkish{font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.g-row.project .g-label .linkish{font-weight:700}
.g-track{position:relative;flex:none}
.g-headrow{min-height:42px}
.g-scale .g-mo{position:absolute;top:4px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;padding-left:4px;border-left:1px solid var(--line)}
.g-scale .g-wk{position:absolute;bottom:3px;font-size:10.5px;color:var(--muted);padding-left:3px}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.65;z-index:1;pointer-events:none}
.g-todaylbl{width:auto;background:none;color:var(--danger);font-size:10px;font-weight:700;top:auto;bottom:1px;opacity:1;padding-left:4px;border-left:2px solid var(--danger)}
.g-bar{position:absolute;top:9px;height:20px;border-radius:5px;background:var(--surface2);border:1px solid var(--teal);overflow:hidden;cursor:grab;z-index:2;touch-action:none;user-select:none}
.g-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.8}
.g-bar em{position:absolute;right:6px;top:1px;font-style:normal;font-size:11px;font-weight:700;color:var(--ink)}
.g-bar.phase{top:13px;height:12px;background:var(--teal);border-color:var(--teal)}.g-bar.phase em{display:none}
.g-bar.project{cursor:pointer;height:22px;top:8px}
.g-bar.late{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.g-rs{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize}
.g-ms{position:absolute;top:12px;width:14px;height:14px;transform:rotate(45deg);background:var(--accent);border:2px solid var(--bg);z-index:2;cursor:grab;touch-action:none}
.g-ms.late{background:var(--danger)}.g-ms.done{background:var(--teal)}
.g-mtxt{position:absolute;top:11px;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none}

.pick{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;text-transform:none;letter-spacing:0}
.pickbtn{border:1px solid var(--teal);background:transparent;color:var(--ink);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.pickbtn:hover{background:var(--accent-soft)}
.pickbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pickbtn[aria-pressed="true"]::before{content:"✓ "}
.secswitch{display:inline-flex;gap:4px;padding:4px;margin-top:20px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.secbtn{border:0;background:transparent;color:var(--soft);font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:9px 26px;border-radius:999px;cursor:pointer}
.secbtn:hover{color:var(--ink)}
.secbtn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.addopt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.addopt:hover,.addopt:focus-visible{border-color:var(--teal)}
.addopt b{font-weight:700;font-size:14px}
.addopt span{font-size:12px;color:var(--muted);line-height:1.35}
.addsec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.ostat{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--soft);vertical-align:2px}
.ostat.sent{border-color:var(--teal);color:var(--ink)}
.ostat.accepted{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ostat.rejected,.ostat.expired{border-color:var(--danger);color:var(--danger)}
.ostat.superseded{text-decoration:line-through}
.stat.hi{background:var(--accent);border-color:var(--accent)}
.stat.hi b,.stat.hi span{color:var(--accent-ink)}
.stat span{display:block}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.toolbar h1{font-size:26px;margin:0;font-weight:800;text-transform:uppercase;color:var(--ink);line-height:1.15}
.search{flex:0 1 280px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.search::placeholder{color:var(--muted)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 240px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:120px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:baseline;gap:6px;margin:0 2px 12px}
.col-head b{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
:root[data-theme="light"] .col-head b{color:var(--teal)}
.col-head span{color:var(--muted);font-size:12px}
.col-sum{margin-left:auto;font-size:12px;color:var(--soft);font-weight:600}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--teal)}
.card[draggable="true"]{cursor:grab}
.card .nm{font-weight:700;line-height:1.3;color:var(--ink)}
.card .sub{font-size:12.5px;color:var(--soft)}
.card .nx{font-size:12px;margin-top:6px;color:var(--muted);font-style:italic}
.card .nx.none{color:var(--warn)}
.card .nx.od{color:var(--danger)}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:11px 16px;border-top:1px solid var(--line);vertical-align:top;font-size:13.5px}
thead th{border-top:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
:root[data-theme="light"] thead th{color:var(--teal)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
td .firm{font-weight:700;color:var(--ink)}
.person{margin-bottom:6px;color:var(--ink)}
.person:last-child{margin-bottom:0}
.person a{font-size:12.5px;margin-right:10px;text-decoration:none}
.person a:hover{text-decoration:underline}
.num{text-align:right;white-space:nowrap;color:var(--ink)}

.ms{list-style:none;margin:0;padding:0;position:relative}
.ms li{position:relative;display:flex;gap:14px;padding:0 0 18px 0}
.ms li::before{content:"";position:absolute;left:12px;top:26px;bottom:0;border-left:2px dashed var(--line)}
.ms li:last-child::before{display:none}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--teal);background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);cursor:pointer;padding:0}
.ms li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ms li.past:not(.done) .dot{border-color:var(--danger);color:var(--danger)}
.ms .when{font-size:12.5px;color:var(--soft)}
.ms li.today-mark{padding-bottom:14px}
.ms li.today-mark .dot{width:26px;height:2px;border:0;border-radius:0;background:var(--accent);margin-top:12px;cursor:default}
.ms li.today-mark span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.act-day{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:16px 0 4px}
.act{display:flex;gap:10px;padding:5px 0;font-size:13.5px;color:var(--soft)}
.act time{color:var(--muted);font-size:12.5px;width:44px;flex:none}

.backdrop{position:fixed;inset:0;background:rgba(5,10,14,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.backdrop.on{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.drawer.on{transform:none;box-shadow:var(--shadow)}
.dr-head{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 22px 16px}
.dr-title{display:flex;gap:10px;align-items:flex-start}
.dr-title h2{margin:0;font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.2;flex:1;color:var(--ink)}
.dr-body{overflow-y:auto;padding:18px 22px 40px;flex:1}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 18px;margin:14px 0 0;font-size:14px}
.facts dt{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere;color:var(--ink)}
.stage-sel{padding:6px 12px;border:1px solid var(--teal);border-radius:999px;background:var(--bg);color:var(--ink);font-weight:600;font-size:13px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.section .panel-head{margin-bottom:6px}
.summary{white-space:pre-wrap;margin:6px 0 0;font-size:13.5px;color:var(--soft)}
.contact{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.contact:first-child{border-top:0}
.contact .who{flex:1;min-width:0}
.contact .who b{display:block;color:var(--ink)}
.contact .lines{font-size:13px;display:flex;flex-direction:column}
.contact .lines a{text-decoration:none;overflow-wrap:anywhere}
.contact .lines a:hover{text-decoration:underline}
details.more summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px}

dialog{border:1px solid var(--line);border-radius:var(--r-lg);padding:0;width:min(540px,calc(100% - 24px));background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,10,14,.65)}
.form{padding:24px;display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 40px);overflow-y:auto}
.form h2{margin:0 0 4px;font-size:20px;font-weight:800;text-transform:uppercase;color:var(--ink)}
.form label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.form input,.form select,.form textarea{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.form input::placeholder,.form textarea::placeholder{color:var(--muted)}
.form textarea{resize:vertical;min-height:90px}
.t24{display:flex;align-items:center;gap:6px}.t24 select{flex:1;min-width:0}.t24 b{color:var(--ink);font-weight:700}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .err{color:var(--danger);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.form [aria-invalid="true"]{border-color:var(--danger)}
.form-actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.hint{font-size:11px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}

.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;margin-top:14px}
.foot{color:var(--muted);font-size:12px;padding:20px 28px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .round-name{font-size:24px}.meter-big{font-size:30px}
  .meter-block{grid-template-columns:1fr}
  .form .row2{grid-template-columns:1fr}
  .wrap{padding:0 16px}.foot{padding:20px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root[data-theme="light"] .g-bar i{background:var(--teal);opacity:.45}

@media (prefers-color-scheme:light){
:root[data-theme="auto"] .g-bar i{background:var(--teal);opacity:.45}
:root[data-theme="auto"]{
  --bg:#EEF2F0;--surface:#FFFFFF;--surface2:#F4F7F6;--ink:#0F1C24;--text:#132430;--muted:#4A5C68;--soft:#4A5C68;--line:#C9D3D8;
  --accent:#0F1C24;--accent-ink:#9BF9C2;--accent-soft:rgba(26,166,183,.12);--teal:#137F8C;--late:#1AA6B7;
  --warn:#8A5A00;--warn-soft:#FBF0DA;--danger:#B23A31;--danger-soft:#FBE7E5;--shadow:0 12px 40px rgba(15,28,36,.18);--logo-filter:invert(1);color-scheme:light}
:root[data-theme="auto"] .mint{color:var(--teal)}
:root[data-theme="auto"] .brandbar .lbl{color:var(--teal)}
:root[data-theme="auto"] .meter .c{background:var(--teal)}
:root[data-theme="auto"] .legend .k-c{background:var(--teal)}
:root[data-theme="auto"] .btn.ghost{color:var(--teal)}
:root[data-theme="auto"] .panel h2,:root[data-theme="auto"] .section h2{color:var(--teal)}
:root[data-theme="auto"] .next b{color:var(--teal)}
:root[data-theme="auto"] .prep.ok{color:var(--teal)}
:root[data-theme="auto"] .stage::before{background:var(--teal)}
:root[data-theme="auto"] .pbar i{background:var(--teal)}
:root[data-theme="auto"] .col-head b{color:var(--teal)}
:root[data-theme="auto"] thead th{color:var(--teal)}
}
</style>
</head>

const UI={prio:"",tab:"overview",openInv:null,taskFilter:"open",person:"",search:"",sort:(()=>{try{return localStorage.getItem("crm-invsort")||"name"}catch(e){return "name"}})(),ready:false};
const PRIOS=[["high","High"],["medium","Medium"],["low","Low"]],PRIO_RANK={high:0,medium:1,low:2};
function prioBadge(p){const x=PRIOS.find(z=>z[0]===p);return x?`<span class="prio ${p}">${x[1]}</span>`:`<span class="meta">–</span>`}
function prioMatch(i){return !UI.prio||(UI.prio==="none"?!i.priority:i.priority===UI.prio)}
function invSort(a,b){if(UI.sort==="ticket"){const d=(Number(b.ticket)||0)-(Number(a.ticket)||0);if(d)return d}if(UI.sort==="priority"){const d=(PRIO_RANK[a.priority]??3)-(PRIO_RANK[b.priority]??3);if(d)return d}return String(a.name||"").localeCompare(String(b.name||""),"fi",{sensitivity:"base"})}
function sortCtl(){return `<div role="group" aria-label="Sort investors" style="display:flex;gap:4px">${[["name","A–Z"],["ticket","Biggest ticket first"],["priority","Priority"]].map(([k,l])=>`<button class="btn sm ${UI.sort===k?"primary":""}" data-sort="${k}" aria-pressed="${UI.sort===k}">${l}</button>`).join("")}</div>`}
let db=null,RO=false,mode="local";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowIso=()=>new Date().toISOString();
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const list=c=>Object.values(S[c]);
const stageLabel=k=>(STAGES.find(s=>s[0]===k)||[,k])[1];
function fmtDate(iso){if(!iso)return"";const d=new Date(iso.length<=10?iso+"T00:00":iso);if(isNaN(d))return iso;const o={day:"numeric",month:"short"};if(d.getFullYear()!==new Date().getFullYear())o.year="numeric";return d.toLocaleDateString("en-GB",o)}
function fmtMoney(n,short){const cur=S.round.currency||"EUR";if(n==null||n==="")return"–";n=Number(n);try{if(short&&Math.abs(n)>=1e6)return new Intl.NumberFormat("en-IE",{style:"currency",currency:cur,maximumFractionDigits:2,notation:"compact"}).format(n);return new Intl.NumberFormat("en-IE",{style:"currency",currency:cur,maximumFractionDigits:0}).format(n)}catch(e){return n.toLocaleString()+" "+cur}}
function daysBetween(a,b){return Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5)}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600)}
function stagePill(k){return `<span class="stage ${k==="passed"?"passed":""}" style="--o:${STAGE_O[k]||1}">${esc(stageLabel(k))}</span>`}

function linkify(s){return esc(s).replace(/https?:\/\/[^\s<]+/g,u=>{let url=u.replace(/[).,;:!?]+$/,""),tail=u.slice(url.length),label;
  try{const x=new URL(url.replace(/&amp;/g,"&")),host=x.hostname.replace(/^www\./,""),p=x.pathname;
    label=host==="docs.google.com"?(p.startsWith("/presentation")?"Google Slides":p.startsWith("/spreadsheets")?"Google Sheets":p.startsWith("/document")?"Google Doc":p.startsWith("/forms")?"Google Form":"Google Docs"):host==="drive.google.com"?"Google Drive file":(host+(p.length>1?(p.length>24?p.slice(0,22)+"…":p):""));if(label.length>34)label=label.slice(0,32)+"…"}catch(e){label=url.slice(0,32)+"…"}
  return `<a href="${url}" target="_blank" rel="noopener" data-stop title="${url}" class="xlink">${label} ↗</a>${tail}`})}
function mpAccess(){const a=window.MP_ACCESS;return a?{investor:a.investor!==false,sales:a.sales!==false,projects:a.projects!==false,admin:!!a.admin}:{investor:true,sales:true,projects:true,admin:true}}
/* ---------- storage ---------- */
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r){const d=JSON.parse(r);for(const k in d)S[k]=d[k]}}catch(e){}}
function saveLocal(){if(db)return;try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function handleErr(e){
  const code=e&&e.code;
  if(code==="invalid_argument"){setRO(true);toast("You can view this tracker but not change it.")}
  else if(code==="quota_exceeded")toast("Storage is full. Delete some old entries to add new ones.");
  else if(code==="resource_exhausted")toast("Too many changes at once. Wait a moment and try again.");
  else toast("Couldn't save that change. Check your connection and try again.");
}
async function put(col,id,data){
  S[col][id]=data;render();
  if(db){try{await db.collection(col).doc(id).set(data)}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await db.collection(col).doc(id).set(data)}catch(e2){handleErr(e2)}}else handleErr(e)}}
  else saveLocal();
}
async function del(col,id){
  delete S[col][id];render();
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){handleErr(e)}}else saveLocal();
}
async function putRound(data){
  S.round=data;render();
  if(db){try{await db.doc("round/main").set(data)}catch(e){handleErr(e)}}else saveLocal();
}
function logAct(text,investorId,kind){const id=uid();put("activity",id,{id,text,investorId:investorId||"",kind:kind||"note",at:nowIso()})}
function setRO(v){RO=v;document.body.classList.toggle("ro",v);render()}

/* ---------- derived ---------- */
function invTasks(id){return list("tasks").filter(t=>t.investorId===id)}
function invDiscs(id){return list("discussions").filter(d=>d.investorId===id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||"").localeCompare(a.createdAt||""))}
function lastContact(id){const d=invDiscs(id)[0];return d?d.date:""}
function nextTask(id){return invTasks(id).filter(t=>t.status!=="done").sort(byDue)[0]}
function byDue(a,b){return (a.due||"9999").localeCompare(b.due||"9999")||(a.createdAt||"").localeCompare(b.createdAt||"")}
function splitPeople(s){return String(s||"").split(/\s*(?:&|,|\/|\band\b|\bja\b)\s*/i).map(x=>x.trim()).filter(Boolean)}
function allPeople(){const m=new Map();for(const o of [...list("tasks").map(t=>t.owner),...list("investors").map(i=>i.owner)])for(const p of splitPeople(o)){const k=p.toLowerCase();if(!m.has(k))m.set(k,p)}return [...m.values()].sort((a,b)=>a.localeCompare(b))}
function matchPerson(t,p){if(!p)return true;const ps=splitPeople(t.owner);if(p==="__none")return !ps.length;return ps.some(x=>x.toLowerCase()===p.toLowerCase())}
function personStrip(all){
  const open=all.filter(t=>t.status!=="done"),td=today();
  const card=(key,label,arr)=>{const od=arr.filter(t=>t.due&&t.due<td).length;const sel=UI.person===key;return `<button class="pcard ${sel?"on":""}" data-person="${esc(key)}" aria-pressed="${sel}"><span class="pn">${esc(label)}</span><span class="pc"><b>${arr.length}</b> open${od?`<em>${od} overdue</em>`:""}</span></button>`};
  const un=open.filter(t=>!splitPeople(t.owner).length);
  return `<div class="pstrip" role="group" aria-label="Filter tasks by responsible person">${card("","Everyone",open)}${allPeople().map(p=>card(p,p,open.filter(t=>matchPerson(t,p)))).join("")}${un.length||UI.person==="__none"?card("__none","Unassigned",un):""}</div>`;
}
function dueClass(t){if(t.status==="done"||!t.due)return"";const td=today();if(t.due<td)return"od";if(t.due<=addDays(td,3))return"soon";return""}

/* ---------- meetings ---------- */
function prepDays(){const v=S.round.prepDays,n=Number(v);return v==null||v===""||isNaN(n)?7:n}
function prepDue(date,days){const d=addDays(date,-(Number(days)||0)),td=today();return d<td?td:d}
function prepTitle(m){const i=S.investors[m.investorId];return `Prepare materials for ${i?i.name:"investor"} ${String(m.kind||"Meeting").toLowerCase()} on ${fmtDate(m.date)}`}
function plannedMeetings(invId){return list("meetings").filter(m=>m.status==="planned"&&(!invId||m.investorId===invId)).sort((a,b)=>((a.date||"")+(a.time||"")).localeCompare((b.date||"")+(b.time||"")))}
function nextMeeting(invId){const td=today();return plannedMeetings(invId).find(m=>m.date>=td)}
function prepStatus(m){const t=S.tasks[m.prepTaskId];if(!t)return `<span class="prep">No prep task</span>`;if(t.status==="done")return `<span class="prep ok">Prep done</span>`;const dc=dueClass(t);return `<button class="linkish prep ${dc}" data-act="edit-task" data-id="${esc(t.id)}">${dc==="od"?"Prep overdue since":"Prep due"} ${fmtDate(t.due)}</button>`}
function meetingRow(m,showInv=true){
  const inv=S.investors[m.investorId],td=today(),past=m.date<td,isToday=m.date===td;
  return `<li class="task"><div class="tmain"><button class="linkish" data-act="edit-meeting" data-id="${esc(m.id)}">${esc(m.title||m.kind||"Meeting")}</button>
    <div class="meta">${showInv&&inv?`<button class="chip" data-open-inv="${esc(inv.id)}">${esc(inv.name)}</button>`:""}<span class="kind">${esc(m.kind||"Meeting")}</span>${m.calEventId?`<a class="chip" href="${esc(m.calLink||"#")}" target="_blank" rel="noopener" data-stop title="Open in Google Calendar">In calendar</a>`:past?"":`<a class="chip" href="${esc(calUrl(m))}" target="_blank" rel="noopener" data-stop title="Open a pre-filled event in Google Calendar">${m.calLinked?"Calendar link":"Add to calendar"} ↗</a>`}${past?`<span class="prep od">Notes not logged yet</span>`:prepStatus(m)}${past||isToday?`<button class="btn sm w" data-act="held-meeting" data-id="${esc(m.id)}">Log notes</button>`:""}</div></div>
    <span class="due ${past?"od":isToday?"soon":""}">${isToday?"Today":fmtDate(m.date)}${m.time?" "+esc(m.time):""}</span></li>`;
}

/* ---------- header ---------- */
function renderHeader(){
  const r=S.round;$("#roundName").innerHTML='Money <span class="mint">Penny</span>';document.title="Money Penny";
  const inv=list("investors");
  const committed=inv.filter(i=>i.stage==="committed"||i.stage==="closed").reduce((s,i)=>s+(Number(i.ticket)||0),0);
  const late=inv.filter(i=>i.stage==="dd"||i.stage==="termsheet").reduce((s,i)=>s+(Number(i.ticket)||0),0);
  const target=Number(r.target)||0;
  let sub=[];
  if(r.closeDate){const d=daysBetween(today(),r.closeDate);sub.push(`Target close ${fmtDate(r.closeDate)}`+(d>=0?` (${d} day${d===1?"":"s"} left)`:` (${-d} days ago)`))}
  sub.push(`${inv.filter(i=>i.stage!=="passed").length} investors in the pipeline`);
  $("#roundSub").textContent=(r.name||"Investor round")+(sub.length?": "+sub.join(", "):"");
  const scale=Math.max(target,committed+late,1);
  const pct=v=>Math.min(100,v/scale*100);
  $("#meter").innerHTML=`
    <div class="meter-card"><div class="k">Committed</div><div class="meter-big">${fmtMoney(committed,true)}</div><div class="meter-of">${target?`of ${fmtMoney(target,true)} target (${Math.round(committed/target*100)}%)`:"No target set yet"}</div></div>
    <div class="meter-panel"><div class="meter" role="img" aria-label="Committed ${fmtMoney(committed)}, in due diligence or term sheet ${fmtMoney(late)}${target?", target "+fmtMoney(target):""}">
      <div class="seg l" style="left:${pct(committed)}%;width:${pct(late)}%"></div>
      <div class="seg c" style="width:${pct(committed)}%;${committed+late>=scale-1?"border-radius:7px":""}"></div>
      ${target?`<div class="tgt" style="left:calc(${pct(target)}% - 1px)"></div>`:""}
    </div>
    <div class="legend"><span><i class="k-c"></i>Committed or money in ${fmtMoney(committed)}</span><span><i class="k-l"></i>Due diligence or term sheet ${fmtMoney(late)}</span>${target?`<span><i class="k-t"></i>Target ${fmtMoney(target)}</span>`:`<span class="w"><button class="linkish" data-act="edit-round" style="color:var(--accent)">Set a target amount</button></span>`}</div>
    </div>${RO?`<div class="notice" style="grid-column:1/-1">You can view this tracker but not change it. Ask the owner for edit access.</div>`:""}`;
  const openT=list("tasks").filter(t=>t.status!=="done").length;
  const AC=mpAccess();document.body.classList.toggle("no-inv",!AC.investor);document.body.classList.toggle("no-sales",!AC.sales);
  const invTabs=[["overview","Overview"],["pipeline","Pipeline"],["investors","Investors & contacts",inv.length],["tasks","Tasks",openT],["timeline","Timeline"]];
  const salesTabs=[["sales-overview","Overview"],["sales-pipeline","Pipeline",list("deals").filter(dealOpen).length],["sales-offers","Offers",list("offers").filter(o=>o.status==="sent").length],["sales-followups","Follow-ups",list("dealtasks").filter(t=>t.status!=="done").length],["stakeholders","Stakeholders",list("stakeholders").length]];
  const projTabs=[["projects","Projects",list("projects").filter(p=>p.status!=="done").length],["gantt","Timeline"],["ptasks","Tasks",list("ptasks").filter(t=>t.kind!=="phase"&&num(t.progress)<100).length]];
  const allowed=[...(AC.investor?invTabs.map(t=>t[0]):[]),...(AC.sales?["sales","stakeholders"]:[]),...(AC.projects?PROJ_TABS:[])];
  if(!allowed.includes(UI.tab))UI.tab=AC.investor?"overview":AC.sales?"sales":"projects";
  const sec=sectionOf(UI.tab);
  const cur=UI.tab==="sales"?"sales-"+(UI.dlView||"overview"):UI.tab;
  if(sec==="sales")UI.lastSales=cur;else if(sec==="projects")UI.lastProj=cur;else UI.lastInv=cur;
  document.body.classList.toggle("sec-sales",sec==="sales");document.body.classList.toggle("sec-proj",sec==="projects");
  const tb=([k,l,n])=>`<button class="tab" role="tab" aria-selected="${cur===k}" data-tab="${k}">${l}${n?`<span class="n">${n}</span>`:""}</button>`;
  $("#tabs").innerHTML=(sec==="sales"?salesTabs:sec==="projects"?projTabs:invTabs).map(tb).join("");
  const secs=[["investor","Investor",AC.investor],["sales","Sales",AC.sales],["projects","Projects",AC.projects]].filter(x=>x[2]);
  $("#secswitch").innerHTML=secs.length>1?`<div class="secswitch" role="tablist" aria-label="Section">${secs.map(([k,l])=>`<button class="secbtn" role="tab" aria-selected="${sec===k}" data-section="${k}">${l}</button>`).join("")}</div>`:"";
  {const l=$("#brandLbl");if(l)l.textContent=secs.map(x=>x[1]).join(" · ")||"CRM"}
  $("#foot").textContent=mode==="shared"?"Changes are saved and shared live with everyone who has access to this page.":"Changes are saved in this browser only.";
}

/* ---------- task row ---------- */
function taskRow(t,showInv=true){
  const inv=S.investors[t.investorId];const dc=dueClass(t);
  return `<li class="task ${t.status==="done"?"done":""}">
    <span class="chk"><input type="checkbox" aria-label="Mark done: ${esc(t.title)}" data-task="${esc(t.id)}" ${t.status==="done"?"checked":""} ${RO?"disabled":""}></span>
    <div class="tmain"><button class="linkish ttl" data-act="edit-task" data-id="${esc(t.id)}">${esc(t.title)}</button>
      <div class="meta">${showInv&&inv?`<button class="chip" data-open-inv="${esc(inv.id)}">${esc(inv.name)}</button>`:""}${splitPeople(t.owner).map(p=>`<button class="pchip" data-person="${esc(p)}" title="Show tasks for ${esc(p)}">${esc(p)}</button>`).join("")}${t.status==="done"&&t.doneAt?`<span>Done ${fmtDate(t.doneAt)}</span>`:""}</div></div>
    <span class="due ${dc}">${t.due?(dc==="od"?"Overdue, ":"")+fmtDate(t.due):""}</span></li>`;
}
function discBlock(d,showInv){
  const inv=S.investors[d.investorId];
  return `<div class="disc"><div class="disc-head"><span class="disc-date">${fmtDate(d.date)}</span><span class="kind">${esc(d.kind||"Note")}</span>
    <button class="linkish" data-act="edit-disc" data-id="${esc(d.id)}" style="font-weight:700">${esc(d.title||"Untitled")}</button>
    ${showInv&&inv?`<button class="chip" data-open-inv="${esc(inv.id)}">${esc(inv.name)}</button>`:""}</div>
    ${d.attendees?`<div class="meta">With ${esc(d.attendees)}</div>`:""}
    ${d.notes?`<p>${linkify(d.notes)}</p>`:""}
    ${d.nextSteps?`<div class="next"><b>Next steps:</b> ${linkify(d.nextSteps)}</div>`:""}</div>`;
}

/* ---------- views ---------- */
function vOverview(){
  const inv=list("investors"),tasks=list("tasks");const td=today();
  const open=tasks.filter(t=>t.status!=="done").sort(byDue);
  const overdue=open.filter(t=>t.due&&t.due<td);
  const since=addDays(td,-30);
  const recentD=list("discussions").filter(d=>(d.date||"")>=since);
  const active=inv.filter(i=>!["target","passed"].includes(i.stage));
  const ms=list("milestones").filter(m=>!m.done).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9")).slice(0,4);
  const discs=list("discussions").sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||"").localeCompare(a.createdAt||""));
  const fdis=fapply("id",discs,{text:d=>[d.title,d.notes,d.nextSteps,d.attendees,S.investors[d.investorId]?.name].join(" "),ent:d=>d.investorId,date:d=>d.date,kind:d=>d.kind||"Note",mode:"past"});
  const stale=active.filter(i=>!["committed","closed"].includes(i.stage)&&!nextTask(i.id));
  const mtgs=plannedMeetings();
  if(!inv.length&&!tasks.length)return `<div class="panel" style="max-width:620px">
    <h1 style="font-size:24px;margin:0;text-transform:uppercase;color:var(--ink);line-height:1.2">Start tracking <span class="mint">your round</span></h1>
    <p style="color:var(--soft);font-style:italic;margin:8px 0 14px">Add the investors you're talking to, their contact people, and every meeting or call. Tasks and timeline milestones keep the round moving.</p>
    <div class="w" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="add-investor">Add your first investor</button><button class="btn" data-act="edit-round">Set round target and close date</button></div></div>`;
  return `<div class="stats">
    <div class="stat"><b>${active.length}</b><span>Active conversations</span></div>
    <div class="stat"><b>${mtgs.filter(m=>m.date>=td&&m.date<=addDays(td,14)).length}</b><span>Meetings in next 14 days</span></div>
    <div class="stat"><b>${recentD.length}</b><span>Discussions in last 30 days</span></div>
    <div class="stat"><b>${open.length}</b><span>Open tasks</span></div>
    <div class="stat ${overdue.length?"alert":""}"><b>${overdue.length}</b><span>Overdue tasks</span></div></div>
  <div class="grid">
    <section class="panel"><div class="panel-head"><h2>Upcoming meetings</h2><span class="sp"></span><button class="btn sm ghost w" data-act="add-meeting">Schedule meeting</button></div>
      ${mtgs.length?(()=>{const fm=fapply("im",mtgs,{text:m=>[m.title,m.kind,m.attendees,m.notes,m.location,S.investors[m.investorId]?.name].join(" "),ent:m=>m.investorId,date:m=>m.date,kind:m=>m.kind||"Meeting",mode:"future"});return fbar("im",{ph:"Search meetings",ents:invOpts(),entAll:"All investors",kinds:pairs(MKINDS),mode:"future"})+fcount("im",fm.length,mtgs.length)+(fm.length?`<ul class="clean">${flimit("im",fm,6).map(m=>meetingRow(m)).join("")}</ul>${fmore("im",fm.length,6)}`:`<div class="empty">No meetings match these filters.</div>`)})():`<div class="empty">Schedule investor meetings here. Each one gets a prep task automatically, due ${prepDays()} days before the meeting.</div>`}
    </section>
    <section class="panel"><div class="panel-head"><h2>Next up</h2><span class="sp"></span><button class="btn sm ghost w" data-act="add-task">Add task</button></div>
      ${open.length?`<ul class="clean">${open.slice(0,7).map(t=>taskRow(t)).join("")}</ul>${open.length>7?`<button class="btn sm ghost" data-tab="tasks" style="margin-top:6px">See all ${open.length} open tasks</button>`:""}`:`<div class="empty">No open tasks. Add follow-ups after each meeting so nothing slips.</div>`}
      ${stale.length?`<div class="group-label" style="color:var(--warn)">No next step planned</div><div class="meta">${stale.map(i=>`<button class="chip" data-open-inv="${esc(i.id)}">${esc(i.name)}</button>`).join("")}</div>`:""}
    </section>
    <section class="panel"><div class="panel-head"><h2>Recent discussions</h2><span class="sp"></span><button class="btn sm ghost w" data-act="add-disc">Log discussion</button></div>
      ${discs.length?fbar("id",{ph:"Search discussions",ents:invOpts(),entAll:"All investors",kinds:pairs(KINDS),mode:"past"})+fcount("id",fdis.length,discs.length)+(fdis.length?flimit("id",fdis,5).map(d=>discBlock(d,true)).join("")+fmore("id",fdis.length,5):`<div class="empty">No discussions match these filters.</div>`):`<div class="empty">Log meetings, calls and emails here to keep the key points and agreed next steps in one place.</div>`}
    </section>
    <section class="panel"><div class="panel-head"><h2>Upcoming milestones</h2><span class="sp"></span><button class="btn sm ghost" data-tab="timeline">Timeline</button></div>
      ${ms.length?`<ul class="clean">${ms.map(m=>`<li class="task"><div class="tmain"><button class="linkish" data-act="edit-ms" data-id="${esc(m.id)}">${esc(m.title)}</button></div><span class="due ${m.date&&m.date<td?"od":""}">${fmtDate(m.date)}</span></li>`).join("")}</ul>`:`<div class="empty">Plan key dates like deck ready, first close and final close.<br><button class="btn sm w" data-act="add-ms">Add milestone</button></div>`}
    </section>
  </div>`;
}

function vPipeline(){
  const inv=list("investors");
  return `<div class="toolbar"><h1>Round <span class="mint">pipeline</span></h1><span class="sp"></span>${sortCtl()}<span class="hint w" style="font-size:12.5px;font-style:italic;color:var(--soft)">Drag cards between stages, or open one to change it</span></div>
  <div class="board">${STAGES.map(([k,l])=>{
    const items=inv.filter(i=>(i.stage||"target")===k).sort(invSort);
    const sum=items.reduce((s,i)=>s+(Number(i.ticket)||0),0);
    return `<div class="col" data-col="${k}"><div class="col-head"><b>${l}</b><span>${items.length}</span>${sum?`<span class="col-sum">${fmtMoney(sum,true)}</span>`:""}</div>

  if(f.type==="textarea")return `<label>${lab}<textarea name="${f.k}" rows="${f.rows||4}" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>${pickRow(f.k,f.pick)}</label>`;
  if(f.type==="time24"){const [hh,mm]=String(v||"").split(":");const mins=["00","05","10","15","20","25","30","35","40","45","50","55"];if(mm&&!mins.includes(mm)){mins.push(mm);mins.sort()}
    return `<label>${lab}<span class="t24"><select data-t24h="${f.k}" aria-label="Hour (00–23)"><option value="">--</option>${Array.from({length:24},(_,i)=>String(i).padStart(2,"0")).map(h=>`<option value="${h}" ${h===hh?"selected":""}>${h}</option>`).join("")}</select><b>:</b><select data-t24m="${f.k}" aria-label="Minutes">${mins.map(x=>`<option value="${x}" ${x===(mm||"00")?"selected":""}>${x}</option>`).join("")}</select><input type="hidden" name="${f.k}" value="${esc(v)}"></span></label>`}

  return `<label>${lab}<input name="${f.k}" type="${f.type||"text"}" value="${esc(v)}" placeholder="${esc(f.ph||"")}" ${f.opts?`list="dl-${f.k}" autocomplete="off"`:""} ${f.type==="number"?'inputmode="decimal" min="0" step="any"':""}>${f.opts?`<datalist id="dl-${f.k}">${f.opts.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}<span class="err" hidden></span>${pickRow(f.k,f.pick)}</label>`;
}
function flat(fields){return fields.flatMap(f=>f.type==="row"?f.fields:[f])}
function openForm({title,fields,values={},onSave,onDelete,saveLabel="Save"}){
  const dlg=$("#dlg");
  fields.forEach(f=>{if(f.type==="row")f._vals=values});
  dlg.innerHTML=`<form class="form" novalidate><h2>${esc(title)}</h2>${fields.map(f=>fieldHtml(f,values[f.k])).join("")}
    <div class="form-actions">${onDelete?`<button type="button" class="btn danger" data-del>Delete</button>`:""}<span class="sp"></span>
    <button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary" type="submit">${esc(saveLabel)}</button></div></form>`;
  const form=dlg.querySelector("form");
  form.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest("[data-pick]");if(!b)return;ev.preventDefault();const el=form.elements[b.dataset.pick];if(!el)return;const sep=b.dataset.sep,v=b.dataset.val;const parts=pickParts(el.value,sep);const i=parts.findIndex(p=>p.toLowerCase()===v.toLowerCase());if(i>=0)parts.splice(i,1);else parts.push(v);el.value=parts.join(sep);el.dispatchEvent(new Event("input",{bubbles:true}));syncPicks(form)});
  form.addEventListener("input",()=>syncPicks(form));setTimeout(()=>syncPicks(form),0);
  form.addEventListener("change",ev=>{const t=ev.target,k=t.dataset&&(t.dataset.t24h||t.dataset.t24m);if(!k)return;const h=form.querySelector(`[data-t24h="${k}"]`).value,m=form.querySelector(`[data-t24m="${k}"]`).value;form.elements[k].value=h?`${h}:${m}`:""});
  form.querySelector("[data-cancel]").onclick=()=>dlg.close();
  const delBtn=form.querySelector("[data-del]");
  if(delBtn)delBtn.onclick=()=>{if(delBtn.classList.contains("armed")){dlg.close();onDelete()}else{delBtn.classList.add("armed");delBtn.textContent="Click again to delete"}};
  form.onsubmit=e=>{e.preventDefault();const out={};let bad=null;
    for(const f of flat(fields)){const el=form.elements[f.k];let x=el.value.trim();if(f.type==="number")x=x===""?null:Number(x.replace(/[\s,]/g,""));out[f.k]=x;
      const err=el.parentElement.querySelector(".err");
      if(f.required&&!x){el.setAttribute("aria-invalid","true");if(err){err.hidden=false;err.textContent=f.label+" is required."}bad=bad||el}
      else if(f.type==="number"&&x!=null&&isNaN(x)){el.setAttribute("aria-invalid","true");if(err){err.hidden=false;err.textContent="Enter a number, like 250000."}bad=bad||el}
      else{el.removeAttribute("aria-invalid");if(err)err.hidden=true}}
    if(bad){bad.focus();return}
    dlg.close();onSave(out)};
  dlg.showModal();
  setTimeout(()=>form.querySelector("input,textarea,select")?.focus(),30);
}

function saveMeeting(m,v){
  const inviteMode=v.invite;delete v.invite;
  const td=today();

  if(!m){
    const id=uid(),nm={id,...v,status:"planned",prepTaskId:"",createdAt:nowIso()};
    let msg=`${v.kind} scheduled for ${fmtDate(v.date)}`;
    if(v.date>=td)msg+=`. Prep task due ${fmtDate(createPrepTask(nm))}`;
    put("meetings",id,nm);logAct(`${v.kind} scheduled for ${fmtDate(v.date)}: ${v.title}`,v.investorId,"meeting");toast(msg);if(inviteMode&&inviteMode!=="no"&&v.date>=td)calCreate(id,inviteMode==="meet");return;
  }
  const nm={...m,...v},t=S.tasks[m.prepTaskId],open=t&&t.status!=="done";
  if(nm.status==="cancelled"){
    if(open){del("tasks",t.id);nm.prepTaskId=""}
    if(m.status!=="cancelled")logAct(`${nm.kind} cancelled: ${nm.title}`,nm.investorId,"meeting");
  }else if(nm.status==="planned"){
    const moved=m.date!==nm.date||Number(m.prepDays)!==nm.prepDays;
    if(open){if(moved||m.investorId!==nm.investorId||m.kind!==nm.kind){const due=moved?prepDue(nm.date,nm.prepDays):t.due;put("tasks",t.id,{...t,title:prepTitle(nm),investorId:nm.investorId,due});if(moved)toast(`Prep task moved to ${fmtDate(due)}`)}}
    else if(!t&&nm.date>=td&&(m.status==="cancelled"||moved)){toast(`Prep task due ${fmtDate(createPrepTask(nm))}`)}
    if(m.date!==nm.date)logAct(`${nm.kind} moved to ${fmtDate(nm.date)}: ${nm.title}`,nm.investorId,"meeting");
  }
  put("meetings",m.id,nm);
  if(m.calEventId){const moved=calTimes(m).startTime!==calTimes(nm).startTime||calTimes(m).endTime!==calTimes(nm).endTime;
    if(!canCal(m)){if(nm.status==="cancelled"||moved)calElsewhere(m)}
    else if(nm.status==="cancelled")calDelete(nm);else calUpdate(m,nm)}
  else if(inviteMode&&inviteMode!=="no"&&nm.status==="planned"&&nm.date>=td)calCreate(m.id,inviteMode==="meet");
  else if(m.calLinked&&(nm.status==="cancelled"||calTimes(m).startTime!==calTimes(nm).startTime))toast("Remember to update the event in Google Calendar too.");
}

  if(r==="custom")return (!f.from||d>=f.from)&&(!f.to||d<=f.to);

  const n=+r;return mode==="past"?(d>=addDays(td,-n)&&d<=td):(d>=td&&d<=addDays(td,n))}

function projOrdered(id){const all=projItems(id),ord=(a,b)=>(num(a.order)-num(b.order))||(a.start||"").localeCompare(b.start||"");
  const phases=all.filter(t=>t.kind==="phase").sort(ord),out=[];
  for(const ph of phases){out.push({...ph,_lvl:0});for(const c of all.filter(t=>t.parentId===ph.id&&t.kind!=="phase").sort(ord))out.push({...c,_lvl:1})}
  for(const t of all.filter(t=>t.kind!=="phase"&&!phases.some(p=>p.id===t.parentId)).sort(ord))out.push({...t,_lvl:0});
  return out}
function itemEnd(t){return t.kind==="milestone"?(t.start||t.end):(t.end||t.start)}
function projSpan(p){let s=p.start||"",e=p.end||"";for(const t of projItems(p.id)){if(t.start&&(!s||t.start<s))s=t.start;const te=itemEnd(t);if(te&&(!e||te>e))e=te}return [s,e]}
function projProgress(p){const its=projItems(p.id),work=its.filter(t=>t.kind==="task");
  const base=work.length?work:its.filter(t=>t.kind==="phase");
  if(!base.length)return p.status==="done"?100:0;
  let w=0,s=0;for(const t of base){const d=Math.max(1,daysBetween(t.start||itemEnd(t)||today(),itemEnd(t)||t.start||today())+1);w+=d;s+=d*Math.min(100,num(t.progress))}return Math.round(s/w)}
function itemLate(t){const e=itemEnd(t);return !!e&&e<today()&&num(t.progress)<100}

function ganttHtml(rows,scale){

  for(const r of rows){if(r.start&&(!min||r.start<min))min=r.start;const e=r.end||r.start;if(e&&(!max||e>max))max=e}
  if(!min){min=td;max=addDays(td,60)}

    if(dt.getDate()===1||i===0)head+=`<span class="g-mo" style="left:${i*px}px">${dt.toLocaleDateString("en-GB",{month:"short",year:i===0||dt.getMonth()===0?"numeric":undefined})}</span>`;
    if(scale==="week"&&dt.getDay()===1)head+=`<span class="g-wk" style="left:${i*px}px">${dt.getDate()}</span>`}
  const grid=scale==="week"?`background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px ${7*px}px)`:"";

    if(r.start||r.end){const s=r.start||r.end,e=r.end||r.start;
      if(r.kind==="milestone")bar=`<span class="g-ms ${r.late?"late":""} ${num(r.progress)>=100?"done":""}" style="left:${X(s)-7+px/2}px" ${r.drag&&!RO?`data-gid="${esc(r.id)}" data-px="${px}"`:""} title="${esc(r.label)}: ${fmtDate(s)}"></span><span class="g-mtxt" style="left:${X(s)+px/2+10}px">${fmtDate(s)}</span>`;
      else{const w=Math.max(px,(daysBetween(s,e)+1)*px);bar=`<span class="g-bar ${r.kind} ${r.late?"late":""}" style="left:${X(s)}px;width:${w}px" ${r.drag&&!RO?`data-gid="${esc(r.id)}" data-px="${px}"`:""} ${r.open?`data-open-project="${esc(r.id)}"`:""} title="${esc(r.label)}: ${fmtDate(s)} – ${fmtDate(e)}, ${num(r.progress)}%"><i style="width:${Math.min(100,num(r.progress))}%"></i>${w>70?`<em>${num(r.progress)}%</em>`:""}${r.drag&&!RO?`<span class="g-rs" aria-hidden="true"></span>`:""}</span>`}}
    return `<div class="g-row ${r.kind}"><div class="g-label" style="padding-left:${12+r.lvl*18}px">${r.open?`<button class="linkish" data-open-project="${esc(r.id)}">${esc(r.label)}</button>`:`<button class="linkish" data-act="pj-edit-item" data-id="${esc(r.id)}">${r.kind==="milestone"?"◆ ":""}${esc(r.label)}</button>`}${r.sub?`<span class="meta">${esc(r.sub)}</span>`:""}</div><div class="g-track" style="width:${W}px;${grid}">${bar}<span class="g-today" style="left:${tdx}px"></span></div></div>`}).join("");
  return `<div class="gantt"><div class="g-row g-headrow"><div class="g-label"><b>${scale==="week"?"Week starting":"Month"}</b></div><div class="g-track g-scale" style="width:${W}px">${head}<span class="g-today g-todaylbl" style="left:${tdx}px">Today</span></div></div>${body}</div>`;
}

async function calUpdate(prev,next,col="meetings"){
  const ch={},pt=calTimes(prev),nt=calTimes(next);

  catch(e){calErr(e,"Updating the calendar invitation")}

.pill{background:var(--navy);color:var(--mint);border-radius:999px;padding:2px 10px;font-size:10.5px;font-weight:700;white-space:nowrap}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 16px;margin:10px 0 0}.facts dt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.disc{padding:8px 0;border-bottom:1px solid var(--line);break-inside:avoid}.kind{background:var(--mint);color:var(--navy);border-radius:999px;padding:0 7px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.next{border-left:3px solid var(--mint);background:var(--soft);padding:6px 10px;margin:6px 0 0;font-style:italic;white-space:pre-wrap}.next b{font-style:normal}.keep{break-inside:avoid}
a{color:var(--teal)}.print{position:fixed;top:16px;right:16px;background:var(--mint);color:var(--navy);border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}footer{padding:10px 40px 30px;color:var(--muted);font-size:10.5px}
@media print{.print,.toc{display:none}#investors{break-before:page}.inv{break-inside:avoid}.band{padding:20px 28px}main{padding:6px 28px}footer{padding:10px 28px}@page{margin:12mm}}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}.band,main,footer{padding-left:18px;padding-right:18px}}`;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${e(nm)} report ${td}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet"><style>${css}</style></head><body>
<button class="print" onclick="window.print()">Print or save as PDF</button>
<header class="band"><div class="brand">${logo?`<img alt="IOXIO" src="${logo}">`:"<b>IOXIO</b>"}<i></i><span>Money Penny report</span></div>
<h1>${title}</h1><div class="sub">Generated ${e(gen)}${r.closeDate?`. Target close ${fmtDate(r.closeDate)}${days>=0?` (${days} days left)`:` (${-days} days ago)`}`:""}.</div>
<nav class="toc"><a href="#summary">Summary</a><a href="#pipeline">Pipeline</a><a href="#meetings">Meetings</a><a href="#tasks">Tasks by person</a><a href="#timeline">Timeline</a><a href="#investors">Investor profiles</a><a href="#log">Actions log</a></nav></header>
<main>
<h2 id="summary"><small>01</small>Round summary</h2>
<div class="kpis"><div class="kpi hi"><div class="k">Committed</div><div class="v">${fmtMoney(committed)}</div><div class="s">${target?`${Math.round(committed/target*100)}% of target`:"No target set"}</div></div>
<div class="kpi"><div class="k">Due diligence or term sheet</div><div class="v">${fmtMoney(late)}</div><div class="s">Late-stage pipeline</div></div>
<div class="kpi"><div class="k">Target</div><div class="v">${target?fmtMoney(target):"–"}</div><div class="s">${target?`${fmtMoney(Math.max(0,target-committed))} still to raise`:""}</div></div>
<div class="kpi"><div class="k">Investors</div><div class="v">${inv.length}</div><div class="s">${active.length} in active conversations</div></div>
<div class="kpi"><div class="k">Open tasks</div><div class="v">${open.length}</div><div class="s">${overdue.length?`<span class="od">${overdue.length} overdue</span>`:"None overdue"}</div></div>
<div class="kpi"><div class="k">Upcoming meetings</div><div class="v">${upM.length}</div><div class="s">${list("discussions").length} discussions logged</div></div></div>
${table(["Stage","Investors","Total expected ticket"],stageRows,"")}
<h2 id="pipeline"><small>02</small>Pipeline overview</h2>${table(["Investor","Priority","Type","Stage","Our lead","Ticket","Last contact","Next step"],pipeRows,"No investors yet.")}
<h2 id="meetings"><small>03</small>Meetings</h2>
<h3>Upcoming <span class="muted">${upM.length}</span></h3>${table(["When","Investor","Type","Topic and agenda","Attendees","Prep"],upM.map(m=>mRow(m,true)),"No upcoming meetings scheduled.")}
${pastM.length?`<h3>Past and cancelled <span class="muted">${pastM.length}</span></h3>${table(["When","Investor","Type","Topic and agenda","Attendees","Status"],pastM.map(m=>mRow(m,false)),"")}`:""}
<h2 id="tasks"><small>04</small>Tasks by responsible person</h2>${personBlocks}
<h3>Completed tasks <span class="muted">${done.length}</span></h3>${table(["Task","Investor","Responsible","Completed"],doneRows,"No completed tasks yet.")}
<h2 id="timeline"><small>05</small>Round timeline</h2>${table(["#","Milestone","Date","Status"],msRows,"No milestones set.")}
<h2 id="investors"><small>06</small>Investor profiles</h2>${profiles}
<h2 id="log"><small>07</small>Actions log</h2>${table(["When","Investor","Action"],actRows,"No actions recorded yet.")}
</main><footer>Confidential. Exported from Money Penny on ${e(gen)}.</footer></body></html>`;
}
async function exportReport(){
  const html=buildReport();const fname=`${slug(S.round.name)}-report-${today()}.html`;
  if(DL){try{await DL.save({filename:fname,data:html});toast("Report saved. Open it in a browser to read or print to PDF.")}
    catch(err){const c=err&&err.code;if(c==="declined")return;if(c==="rate_limited")toast("A save prompt is already open.");else toast("The report couldn't be saved in this view.")}}
  else{try{const b=new Blob([html],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(err){toast("The report couldn't be saved in this view.")}}
}

/* ---------- events ---------- */

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-tab],[data-open-inv],[data-filter],[data-person],[data-sort],[data-prio],[data-section],[data-open-project],[data-pfilter],[data-gscale],[data-ptperson],[data-ptfilter],[data-open-sh],[data-shcat],[data-shview],[data-shfilter],[data-shperson],[data-open-deal],[data-dlview],[data-dlfilter],[data-dlperson],[data-offfilter],a[data-stop]");if(!el)return;
  if(el.dataset.shcat!==undefined){UI.shCat=el.dataset.shcat;render();return}
  if(el.dataset.dlview){UI.dlView=el.dataset.dlview;render();window.scrollTo({top:0});return}
  if(el.dataset.dlfilter){UI.dlFilter=el.dataset.dlfilter;render();return}
  if(el.dataset.offfilter){UI.offFilter=el.dataset.offfilter;render();return}
  if(el.dataset.dlperson!==undefined){UI.dlPerson=el.dataset.dlperson;UI.dlView="followups";UI.tab="sales";closeDrawer();render();return}
  if(el.dataset.shview){UI.shView=el.dataset.shview;render();window.scrollTo({top:0});return}
  if(el.dataset.shfilter){UI.shFilter=el.dataset.shfilter;render();return}
  if(el.dataset.shperson!==undefined){UI.shPerson=el.dataset.shperson;UI.shView="followups";UI.tab="stakeholders";closeDrawer();render();return}
  if(el.dataset.sort){UI.sort=el.dataset.sort;try{localStorage.setItem("crm-invsort",UI.sort)}catch(e){}render();return}
  if(el.dataset.prio!==undefined){UI.prio=el.dataset.prio;render();return}
  if(el.dataset.person!==undefined){UI.person=el.dataset.person;if(UI.tab!=="tasks"){UI.tab="tasks";closeDrawer();window.scrollTo({top:0})}render();return}
  if(el.matches("a[data-stop]")){e.stopPropagation();return}
  if(el.dataset.openProject&&!el.dataset.act){openProject(el.dataset.openProject);return}
  if(el.dataset.pfilter){UI.pFilter=el.dataset.pfilter;render();return}
  if(el.dataset.gscale){UI.gScale=el.dataset.gscale;render();return}
  if(el.dataset.ptfilter){UI.ptFilter=el.dataset.ptfilter;render();return}
  if(el.dataset.ptperson!==undefined){UI.ptPerson=el.dataset.ptperson;UI.tab="ptasks";closeDrawer();render();return}
  if(el.dataset.section){const sx=el.dataset.section,t=sx==="sales"?(UI.lastSales||"sales-overview"):sx==="projects"?(UI.lastProj||"projects"):(UI.lastInv||"overview");if(t.startsWith("sales-")){UI.dlView=t.slice(6);UI.tab="sales"}else UI.tab=t;UI.search="";closeDrawer();render();window.scrollTo({top:0});return}
  if(el.dataset.tab){let t=el.dataset.tab;if(t.startsWith("sales-")){UI.dlView=t.slice(6);t="sales"}if(UI.tab!==t)UI.search="";UI.tab=t;closeDrawer();render();window.scrollTo({top:0});return}
  if(el.dataset.filter){UI.taskFilter=el.dataset.filter;render();return}
  const a=el.dataset.act;
  if(!a&&el.dataset.openInv){openInv(el.dataset.openInv);return}
  if(!a&&el.dataset.openSh){openSh(el.dataset.openSh);return}
  if(!a&&el.dataset.openDeal){openDeal(el.dataset.openDeal);return}
  const inv=S.investors[UI.openInv];
  if(RO&&!["close-drawer","export","team","theme"].includes(a)&&!a?.startsWith("edit")){if(a)return}
  if(a&&a.startsWith("sh-")){shAction(a,el);return}
  if(a&&a.startsWith("dl-")){dlAction(a,el);return}
  if(a&&a.startsWith("pj-")){pjAction(a,el);return}
  switch(a){
    case "close-drawer":closeDrawer();break;
    case "add-investor":if(!RO)investorForm();break;
    case "add-any":if(!RO)addChooser();break;
    case "team":openTeam();break;
    case "theme":cycleTheme();break;
    case "edit-investor":if(!RO&&inv)investorForm(inv);break;
    case "add-contact":if(inv)contactForm(inv);break;
    case "edit-contact":if(!RO&&inv)contactForm(inv,Number(el.dataset.i));break;
    case "add-task":taskForm(null,el.dataset.inv);break;
    case "edit-task":if(!RO)taskForm(S.tasks[el.dataset.id]);break;
    case "add-disc":discForm(null,el.dataset.inv);break;
    case "edit-disc":if(!RO)discForm(S.discussions[el.dataset.id]);break;
    case "add-ms":msForm();break;
    case "edit-ms":if(!RO)msForm(S.milestones[el.dataset.id]);break;
    case "toggle-ms":{const m=S.milestones[el.dataset.id];if(m&&!RO){put("milestones",m.id,{...m,done:!m.done});if(!m.done)logAct(`Milestone reached: ${m.title}`,"","milestone")}break}
    case "edit-round":if(!RO)roundForm();break;
    case "export":exportReport();break;
    case "add-meeting":meetingForm(null,el.dataset.inv);break;
    case "edit-meeting":if(!RO)meetingForm(S.meetings[el.dataset.id]);break;
    case "held-meeting":{const m=S.meetings[el.dataset.id];if(m&&!RO)discForm(null,m.investorId,m);break}
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.pstatus){const p=S.projects[t.dataset.pstatus];if(p)put("projects",p.id,{...p,status:t.value,updatedAt:nowIso()});return}
  if(t.dataset.ptdone){const x=S.ptasks[t.dataset.ptdone];if(x)savePtask(x,{progress:t.checked?100:0});return}
  if(t.dataset.dltask){const x=S.dealtasks[t.dataset.dltask];if(x)put("dealtasks",x.id,{...x,status:t.checked?"done":"open",doneAt:t.checked?nowIso():""});return}
  if(t.dataset.dealStage){setDealStage(t.dataset.dealStage,t.value);return}
  if(t.dataset.shtask){const x=S.shtasks[t.dataset.shtask];if(x)put("shtasks",x.id,{...x,status:t.checked?"done":"open",doneAt:t.checked?nowIso():""});return}
  if(t.dataset.shStatus){const s=S.stakeholders[t.dataset.shStatus];if(s)put("stakeholders",s.id,{...s,status:t.value,updatedAt:nowIso()});return}
  if(t.dataset.task){toggleTask(t.dataset.task,t.checked)}
  else if(t.dataset.stageFor){setStage(t.dataset.stageFor,t.value)}
  else if(t.dataset.prioFor){const i=S.investors[t.dataset.prioFor];if(i&&(i.priority||"")!==t.value){put("investors",i.id,{...i,priority:t.value,updatedAt:nowIso()});logAct(t.value?`Priority set to ${PRIOS.find(p=>p[0]===t.value)[1]}`:"Priority cleared",i.id,"priority")}}
});
document.addEventListener("input",e=>{if(e.target.hasAttribute("data-search")){UI.search=e.target.value;render()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&(UI.openInv||UI.openSh||UI.openDeal)&&!$("#dlg").open)closeDrawer();
  if(e.key==="Enter"&&e.target.classList?.contains("card"))openInv(e.target.dataset.openInv);
});
document.addEventListener("dragstart",e=>{const c=e.target.closest?.("[data-drag]");if(c){e.dataTransfer.setData("text/plain",c.dataset.drag);e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const col=e.target.closest?.("[data-col]");if(col){e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")}});
document.addEventListener("dragleave",e=>{const col=e.target.closest?.("[data-col]");if(col&&!col.contains(e.relatedTarget))col.classList.remove("over")});
document.addEventListener("drop",e=>{const col=e.target.closest?.("[data-col]");if(col){e.preventDefault();col.classList.remove("over");const id=e.dataTransfer.getData("text/plain");if(id)setStage(id,col.dataset.col)}});

/* ---------- boot ---------- */
async function boot(){
  let d=null,u=null;
  try{if(window.claude&&typeof window.claude.use==="function"){[d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}}catch(e){d=null}
  if(!d&&typeof window.mpSupabaseDb==="function"){try{d=await window.mpSupabaseDb()}catch(e){console.error(e);d=null}}
  if(d){
    db=d;mode="shared";
    try{if(u){const can=await u.can("data.write");if(can===false)RO=true}}catch(e){}
    document.body.classList.toggle("ro",RO);
    let pending=COLS.length+1;
    const done=()=>{if(--pending===0&&!UI.ready){UI.ready=true;render()}};
    db.doc("round/main").onSnapshot(s=>{if(s.exists)S.round={...S.round,...s.data()};render();if(!done.r){done.r=1;done()}},err=>{if(!done.r){done.r=1;done()}});
    for(const c of COLS){
      let first=true;
      const q=c==="activity"?db.collection(c).orderBy("at","desc").limit(500):db.collection(c);
      q.onSnapshot(snap=>{const o={};snap.docs.forEach(x=>{o[x.id]={...x.data(),id:x.id}});S[c]=o;render();if(first){first=false;done()}},
        err=>{if(first){first=false;done()}if(err&&err.code==="revoked"){setRO(true)}});
    }
    setTimeout(()=>{if(!UI.ready){UI.ready=true;render()}},8000);
  }else{
    loadLocal();mode="local";UI.ready=true;render();
  }
}
$("#dlg").addEventListener("close",()=>setTimeout(render,0));
try{applyTheme(localStorage.getItem("mp-theme")||"dark")}catch(e){applyTheme("dark")}
boot();
(async()=>{try{if(window.claude&&typeof window.claude.use==="function")DL=await window.claude.use("downloads")}catch(e){DL=null}})();
(async()=>{try{if(window.claude&&typeof window.claude.use==="function"){MCP=await window.claude.use("mcp");const u=await window.claude.use("user");if(u&&u.id)VIEWER_ID=await u.id()}}catch(e){MCP=null}})();
if("serviceWorker" in navigator&&location.protocol!=="file:"&&!/claudeusercontent\.com$/.test(location.hostname)){window.addEventListener("load",()=>{fetch("./sw.js",{method:"HEAD",cache:"no-store"}).then(r=>{if(r.ok)return navigator.serviceWorker.register("./sw.js")}).catch(()=>{})})}
</script>
